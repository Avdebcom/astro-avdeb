name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck

  demo-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        astro: ["5", "6", "7"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm pack --pack-destination demo
      - working-directory: demo
        run: npm install --no-audit --no-fund astro@${{ matrix.astro }} ./astro-avdeb-*.tgz
      - working-directory: demo
        run: npx astro build
      - working-directory: demo
        run: grep -q 'class="avdeb-card' dist/index.html
